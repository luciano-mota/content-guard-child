name: ContentGuard - gerar APK de teste

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Testes e APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      # Este MVP nao inclui o Gradle Wrapper; instala Gradle no runner.
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar motor de regras (Java puro)
        run: bash engine-tests/run.sh
      - name: Compilar APK de debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK para teste
        uses: actions/upload-artifact@v4
        with:
          name: contentguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
