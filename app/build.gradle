plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.lcmtech.contentguard'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.lcmtech.contentguard'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.1-tv-diagnostics'
    }
    flavorDimensions 'device'
    productFlavors {
        mobile {
            dimension 'device'
        }
        tv {
            dimension 'device'
            applicationIdSuffix '.tv'
            versionNameSuffix '-tv'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
